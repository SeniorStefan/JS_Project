<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>JS_Project — Rings</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="styles.css" rel="stylesheet" />
</head>
<body>
  <div class="container hero-wrap">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-9">
        <section class="glass p-4 p-md-5">
  <div class="d-flex flex-column flex-md-row align-items-start align-items-md-center justify-content-between gap-3 mb-4">
    <div>
      <div class="d-flex align-items-center gap-2 mb-2">
        <span class="badge badge-soft rounded-pill px-3 py-2">Проект</span>
        <span class="badge bg-dark-subtle text-dark rounded-pill px-3 py-2">Rings</span>
      </div>
      <h1 class="display-6 fw-semibold mb-1">Шарик и кольца с прорезью</h1>
      <div class="small-muted">
        Шарик отскакивает от колец. Если залетает в прорезь — кольцо исчезает, счёт растёт, появляется новое внешнее кольцо.
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 justify-content-start justify-content-md-end">
      <div class="hud-pill">
        <span class="small text-uppercase small-muted">Счёт</span>
        <span id="scoreOut" class="fw-semibold">0</span>
      </div>
      <button id="btnReset" class="btn btn-outline-light">Сброс</button>
      <button id="btnPause" class="btn btn-outline-light">Пауза</button>
    </div>
  </div>

  <div class="rings-wrap mt-3">
    <canvas id="ringsCanvas" aria-label="Rings animation" role="img"></canvas>
  </div>
</section>

        <div class="pager-nav">
          <button id="btnPrev" class="btn btn-outline-light pager-btn" type="button" aria-label="Предыдущая страница">←</button>
          <div class="pager-center">
            <div class="pager-title" id="pagerTitle">—</div>
            <div class="pager-dots" id="pagerDots"></div>
          </div>
          <button id="btnNext" class="btn btn-outline-light pager-btn" type="button" aria-label="Следующая страница">→</button>
        </div>

        <div class="text-center mt-3 footer-hint">
          Портфолио: JS + HTML + CSS + Bootstrap. Листай проекты стрелками (или клавишами ← →).
        </div>
      </div>
    </div>
  </div>

  <script>
  window.PORTFOLIO_PAGES = [
